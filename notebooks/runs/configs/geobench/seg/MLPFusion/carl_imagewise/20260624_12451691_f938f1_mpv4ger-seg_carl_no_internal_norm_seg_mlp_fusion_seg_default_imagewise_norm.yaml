task:
  trainer:
    _target_: pangaea.engine.trainer.SegTrainer
    model: null
    train_loader: null
    optimizer: null
    lr_scheduler: null
    evaluator: null
    exp_dir: null
    device: null
    criterion: null
    n_epochs: 80
    precision: fp32
    ckpt_interval: 20
    eval_interval: 5
    log_interval: 5
    best_metric_key: mIoU
    use_wandb: ${use_wandb}
  evaluator:
    _target_: pangaea.engine.evaluator.SegEvaluator
    val_loader: null
    exp_dir: null
    device: null
    use_wandb: ${use_wandb}
    inference_mode: sliding
    sliding_inference_batch: 8
    save_preds_dir: null
dataset:
  _target_: pangaea.datasets.geobench.mpv4ger-seg.mPv4GerSeg
  dataset_name: mPv4GerSeg
  root_path: ${oc.env:GEO_BENCH_DIR}/segmentation_v1.0/m-pv4ger-seg
  download_url: recursix/geo-bench-1.0
  auto_download: true
  img_size: 320
  multi_temporal: false
  multi_modal: false
  ignore_index: -1
  num_classes: 2
  classes:
  - no solar pv
  - solar pv
  distribution:
  - 0
  - 0
  bands:
    optical:
    - B4
    - B3
    - B2
  data_mean:
    optical:
    - 131.102356
    - 137.354091
    - 139.761751
  data_std:
    optical:
    - 54.52768048660482
    - 50.86544377633718
    - 48.29800594656056
  data_min:
    optical:
    - 0.0
    - 0.0
    - 0.0
  data_max:
    optical:
    - 255.0
    - 255.0
    - 255.0
encoder:
  _target_: pangaea.encoders.carl_encoder.CARLEncoder
  encoder_weights: ./pretrained_models/carl_ssl_checkpoint.ckpt
  download_url: https://zenodo.org/records/18671944/files/ssl_checkpoint_carl.ckpt
  input_size: 224
  image_norm: false
  embed_dim: 768
  output_dim: 768
  patch_size: 8
  output_layers:
  - 1
  - 3
  - 5
  - 7
  input_bands:
    optical:
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B9
    - B10
    - B11
    - B12
  spec_encoder_kwargs:
    embed_dim: 384
    depth: 8
    num_heads: 6
    layer_scale: 0.0001
    pos_enc_sigma: 3
    n_queries: 8
    qkv_bias: true
    ffn_bias: true
    drop_path_rate: 0.0
    proj_drop: 0.0
    drop: 0.0
    attn_drop: 0.0
  spat_encoder_kwargs:
    model_name: timm/eva02_base_patch14_224.mim_in22k
    depth: 8
    model_kwargs:
      drop_rate: 0.0
      pos_drop_rate: 0.0
      patch_drop_rate: 0.0
      proj_drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.0
decoder:
  _target_: pangaea.decoders.seg_mlp_fusion.MLPFusionDecoder
  encoder: null
  num_classes: ${dataset.num_classes}
  finetune: ${finetune}
  channels: 128
  multi_temporal: ${dataset.multi_temporal}
  upsample_mode: bilinear
preprocessing:
  train:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.RandomCropToEncoder
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeImageWise
  val:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeImageWise
  test:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeImageWise
criterion:
  _target_: torch.nn.CrossEntropyLoss
  ignore_index: ${dataset.ignore_index}
lr_scheduler:
  _target_: pangaea.utils.schedulers.MultiStepLR
  optimizer: null
  total_iters: null
  lr_milestones:
  - 0.6
  - 0.9
optimizer:
  _target_: torch.optim.AdamW
  params: null
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.05
train: true
work_dir: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/niklas/experiments/geobench/seg/MLPFusion/carl_imagewise
seed: 234
use_wandb: true
wandb_project: geobench
wandb_run_id: q910a0kn
num_workers: 4
batch_size: 8
test_num_workers: 4
test_batch_size: 1
finetune: false
ckpt_dir: null
limited_label_train: 1
limited_label_val: 1
limited_label_strategy: stratified
stratification_bins: 3
data_replicate: 1
use_final_ckpt: false
