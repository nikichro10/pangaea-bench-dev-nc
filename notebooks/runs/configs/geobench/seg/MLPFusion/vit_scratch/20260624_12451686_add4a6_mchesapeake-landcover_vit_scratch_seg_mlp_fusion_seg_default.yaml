  root_path: ${oc.env:GEO_BENCH_DIR}/segmentation_v1.0/m-chesapeake
  download_url: recursix/geo-bench-1.0
  auto_download: true
  img_size: 256
  multi_temporal: false
  multi_modal: false
  ignore_index: -1
  num_classes: 7
  classes:
  - water
  - tree-canopy-forest
  - low-vegetation-field
  - barren-land
  - impervious-other
  - impervious-roads
  - no data
  distribution:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  bands:
    optical:
    - B2
    - B3
    - B4
    - B8
  data_mean:
    optical:
    - 0.4807923436164856
    - 0.5200885534286499
    - 0.4570387601852417
    - 0.569856584072113
  data_std:
    optical:
    - 0.17441707849502563
    - 0.1976749747991562
    - 0.21191735565662384
    - 0.2831788957118988
