    optical:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
  data_max:
    optical:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
encoder:
  _target_: pangaea.encoders.vit_encoder.VIT_Encoder
  encoder_weights: null
  download_url: null
  embed_dim: 768
  input_size: 224
  patch_size: 16
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  input_bands: ${dataset.bands}
  output_layers:
  - 3
  - 5
  - 7
  - 11
  output_dim: 768
decoder:
  _target_: pangaea.decoders.seg_mlp_fusion.MLPFusionDecoder
  encoder: null
  num_classes: ${dataset.num_classes}
  finetune: ${finetune}
  channels: 128
  multi_temporal: ${dataset.multi_temporal}
  upsample_mode: bilinear
preprocessing:
  train:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.RandomCropToEncoder
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  val:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  test:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
criterion:
  _target_: torch.nn.CrossEntropyLoss
  ignore_index: ${dataset.ignore_index}
lr_scheduler:
  _target_: pangaea.utils.schedulers.MultiStepLR
  optimizer: null
  total_iters: null
  lr_milestones:
