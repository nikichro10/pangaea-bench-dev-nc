      PS_Red: 0.63
      GF2_Blue: 0.485
      GF2_Green: 0.555
      GF2_Red: 0.66
      GF2_NIR: 0.83
    sar:
      VV: 3.75
      VH: 3.75
      ASC_VV: 3.75
      ASC_VH: 3.75
      DSC_VV: 3.75
      DSC_VH: 3.75
