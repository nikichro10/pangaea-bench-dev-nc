_target_: pangaea.datasets.spacenet7.SN7CD
dataset_name: SN7CD
root_path: ./data/spacenet7
download_url: https://drive.google.com/uc?id=1BADSEjxYKFZZlM-tEkRUfHvHi5XdaVV9
auto_download: True

img_size: 256  # the image size is used to tile the SpaceNet 7 images (1024, 1024)
domain_shift: True
# parameters for within-scene splits (no domain shift)
i_split: 768
j_split: 512

multi_temporal: 2
multi_modal: False

dataset_multiplier: 1  # multiplies sample in dataset during training
minimum_temporal_gap: 5

# classes
ignore_index: -1
num_classes: 1
classes:
  - No Change
  - Change
# measured from 300 random train-split change-label samples (2026-09),
# same measurement as spacenet7cd.yaml -- identical imagery, only band labels differ
distribution:
  - 0.99366
  - 0.00634

# True PlanetScope PS2 band names (same order and stats as spacenet7cd.yaml)
bands:
  optical:
    - PS_Red    # Band 1 (Red),   centre ~630 nm
    - PS_Green  # Band 2 (Green), centre ~545 nm
    - PS_Blue   # Band 3 (Blue),  centre ~485 nm
data_mean:
  optical:
    - 121.826
    - 106.52838
    - 78.372116
data_std:
  optical:
    - 56.717068
    - 44.517075
    - 40.451515
data_min:
  optical: [0.0, 0.0, 0.0]
data_max:
  optical: [255.0, 255.0, 255.0]
