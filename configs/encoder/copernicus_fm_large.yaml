_target_: pangaea.encoders.copernicus_fm_encoder.CopernicusFM_Encoder
encoder_weights: ./pretrained_models/CopernicusFM_ViT_large_varlang_e100.pth
download_url: https://huggingface.co/wangyi111/Copernicus-FM/resolve/main/CopernicusFM_ViT_large_varlang_e100.pth

# ViT-Large architecture
embed_dim: 1024
depth: 24
num_heads: 16
patch_size: 16
wv_planes: 128
mlp_ratio: 4.0

input_size: 224
input_bands: ${dataset.bands}

output_layers:
  - 5
  - 11
  - 17
  - 23
output_dim: 1024

