_target_: pangaea.encoders.dofav2_encoder.DOFAv2_Encoder
encoder_weights: ./pretrained_models/dofav2_vit_base_e150.pth
download_url: https://huggingface.co/earthflow/DOFA/resolve/main/dofav2_vit_base_e150.pth

embed_dim: 768
input_size: 224
patch_size: 14
depth: 12
num_heads: 12
mlp_ratio: 4
use_norm: False

input_bands: ${dataset.bands}

wave_list:
  optical:
    B1: 0.44
    B2: 0.49
    B3: 0.56
    B4: 0.665
    B5: 0.705
    B6: 0.74
    B7: 0.783
    B8: 0.832
    B8A: 0.864
    B9: 0.945
    B10: 1.373
    B11: 1.61
    B12: 2.20
    # Landsat-8 OLI (m-Forestnet)
    L8_B2: 0.482
    L8_B3: 0.562
    L8_B4: 0.655
    L8_B5: 0.865
    L8_B6: 1.609
    L8_B7: 2.201
    # PlanetScope PS2 (SpaceNet7)
    PS_Blue:  0.485
    PS_Green: 0.545
    PS_Red:   0.630
    # GaoFen-2 (FiveBillionPixels)
    GF2_Blue:  0.485
    GF2_Green: 0.555
    GF2_Red:   0.660
    GF2_NIR:   0.830
  sar:
    VV: 3.75
    VH: 3.75
    ASC_VV: 3.75
    ASC_VH: 3.75
    DSC_VV: 3.75
    DSC_VH: 3.75
    VV-VH: 3.75

output_layers:
  - 4
  - 6
  - 10
  - 11

output_dim: 768
