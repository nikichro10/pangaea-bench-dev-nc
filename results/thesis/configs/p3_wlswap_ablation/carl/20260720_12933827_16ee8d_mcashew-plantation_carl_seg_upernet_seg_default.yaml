encoder:
  _target_: pangaea.encoders.carl_encoder.CARLEncoder
  encoder_weights: ./pretrained_models/carl_ssl_checkpoint.ckpt
  download_url: https://zenodo.org/records/18671944/files/ssl_checkpoint_carl.ckpt
  input_size: 224
  image_norm: false
  embed_dim: 768
  output_dim: 768
  patch_size: 8
  output_layers:
  - 1
  - 3
  - 5
  - 7
  input_bands: ${dataset.bands}
  band_wavelength_overrides:
    optical:
      B1: 2.19
      B2: 1.61
      B3: 0.945
      B4: 0.865
      B5: 0.842
      B6: 0.783
      B7: 0.74
      B8: 0.705
      B8A: 0.665
      B9: 0.56
      B11: 0.49
      B12: 0.443
  spec_encoder_kwargs:
    embed_dim: 384
    depth: 8
    num_heads: 6
    layer_scale: 0.0001
    pos_enc_sigma: 3
    n_queries: 8
    qkv_bias: true
    ffn_bias: true
    drop_path_rate: 0.0
    proj_drop: 0.0
    drop: 0.0
    attn_drop: 0.0
  spat_encoder_kwargs:
    model_name: timm/eva02_base_patch14_224.mim_in22k
    depth: 8
    model_kwargs:
      drop_rate: 0.0
      pos_drop_rate: 0.0
      patch_drop_rate: 0.0
      proj_drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.0
decoder:
