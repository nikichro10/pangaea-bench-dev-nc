task:
  trainer:
    _target_: pangaea.engine.trainer.SegTrainer
    model: null
    train_loader: null
    optimizer: null
    lr_scheduler: null
    evaluator: null
    exp_dir: null
    device: null
    criterion: null
    n_epochs: 80
    precision: fp32
    ckpt_interval: 20
    eval_interval: 5
    log_interval: 5
    best_metric_key: mIoU
    use_wandb: ${use_wandb}
  evaluator:
    _target_: pangaea.engine.evaluator.SegEvaluator
    val_loader: null
    exp_dir: null
    device: null
    use_wandb: ${use_wandb}
    inference_mode: sliding
    sliding_inference_batch: 8
    save_preds_dir: null
dataset:
  _target_: pangaea.datasets.geobench.mneontree.mNeonTree
  dataset_name: mNeonTree
  root_path: ${oc.env:GEO_BENCH_DIR}/segmentation_v1.0/m-NeonTree
  download_url: recursix/geo-bench-1.0
  auto_download: true
  img_size: 400
  multi_temporal: false
  multi_modal: false
  ignore_index: -1
  num_classes: 2
  classes:
  - No tree
  - Tree
  distribution:
  - 0
  - 0
  bands:
    optical:
    - B4
    - B3
    - B2
  data_mean:
    optical:
    - 122.29733333333333
    - 131.00455555555556
    - 108.44846666666666
  data_std:
    optical:
    - 54.053087350753124
    - 51.442224204429245
    - 33.09221632578563
  data_min:
    optical:
    - 0.0
    - 0.0
    - 0.0
  data_max:
    optical:
    - 255.0
    - 255.0
    - 255.0
encoder:
  _target_: pangaea.encoders.vit_encoder.VIT_Encoder
  encoder_weights: null
  download_url: null
  embed_dim: 768
  input_size: 224
  patch_size: 8
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  input_bands: ${dataset.bands}
  output_layers:
  - 3
  - 5
  - 7
  - 11
  output_dim: 768
decoder:
  _target_: pangaea.decoders.seg_mlp_fusion.MLPFusionDecoder
  encoder: null
  num_classes: ${dataset.num_classes}
  finetune: ${finetune}
  channels: 128
  multi_temporal: ${dataset.multi_temporal}
  upsample_mode: bilinear
preprocessing:
  train:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.RandomCropToEncoder
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  val:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  test:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
criterion:
  _target_: torch.nn.CrossEntropyLoss
  ignore_index: ${dataset.ignore_index}
lr_scheduler:
  _target_: pangaea.utils.schedulers.MultiStepLR
  optimizer: null
  total_iters: null
  lr_milestones:
  - 0.6
  - 0.9
optimizer:
  _target_: torch.optim.AdamW
  params: null
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.05
train: true
