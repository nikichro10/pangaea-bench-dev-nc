    depth: 8
    num_heads: 6
    layer_scale: 0.0001
    pos_enc_sigma: 3
    n_queries: 8
    qkv_bias: true
    ffn_bias: true
    drop_path_rate: 0.0
    proj_drop: 0.0
    drop: 0.0
    attn_drop: 0.0
  spat_encoder_kwargs:
    model_name: timm/eva02_base_patch14_224.mim_in22k
