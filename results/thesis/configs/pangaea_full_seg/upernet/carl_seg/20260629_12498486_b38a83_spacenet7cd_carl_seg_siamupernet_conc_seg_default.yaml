task:
  trainer:
    _target_: pangaea.engine.trainer.SegTrainer
    model: null
    train_loader: null
    optimizer: null
    lr_scheduler: null
    evaluator: null
    exp_dir: null
    device: null
    criterion: null
    n_epochs: 80
    precision: fp32
    ckpt_interval: 999
    eval_interval: 5
    log_interval: 5
    best_metric_key: mIoU
    use_wandb: ${use_wandb}
  evaluator:
    _target_: pangaea.engine.evaluator.SegEvaluator
    val_loader: null
    exp_dir: null
    device: null
    use_wandb: ${use_wandb}
    inference_mode: sliding
    sliding_inference_batch: 8
dataset:
  _target_: pangaea.datasets.spacenet7.SN7CD
  dataset_name: SN7CD
  root_path: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/pangaea-datasets/spacenet7cd
  download_url: https://drive.google.com/uc?id=1BADSEjxYKFZZlM-tEkRUfHvHi5XdaVV9
  auto_download: true
  img_size: 256
  domain_shift: true
  i_split: 768
  j_split: 512
  multi_temporal: 2
  multi_modal: false
  dataset_multiplier: 1
  minimum_temporal_gap: 5
  ignore_index: -1
  num_classes: 1
  classes:
  - No Change
  - Change
  distribution:
  - 0.92530769
  - 0.07469231
  bands:
    optical:
    - B4
    - B3
    - B2
  data_mean:
    optical:
    - 121.826
    - 106.52838
    - 78.372116
  data_std:
    optical:
    - 56.717068
    - 44.517075
    - 40.451515
  data_min:
    optical:
    - 0.0
    - 0.0
    - 0.0
  data_max:
    optical:
    - 255.0
    - 255.0
    - 255.0
encoder:
  _target_: pangaea.encoders.carl_encoder.CARLEncoder
  encoder_weights: ./pretrained_models/carl_ssl_checkpoint.ckpt
  download_url: https://zenodo.org/records/18671944/files/ssl_checkpoint_carl.ckpt
  input_size: 224
  image_norm: false
  embed_dim: 768
  output_dim: 768
  patch_size: 8
  output_layers:
  - 1
  - 3
  - 5
  - 7
  input_bands:
    optical:
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B9
    - B10
    - B11
    - B12
  spec_encoder_kwargs:
    embed_dim: 384
    depth: 8
    num_heads: 6
    layer_scale: 0.0001
    pos_enc_sigma: 3
    n_queries: 8
    qkv_bias: true
    ffn_bias: true
    drop_path_rate: 0.0
    proj_drop: 0.0
    drop: 0.0
    attn_drop: 0.0
  spat_encoder_kwargs:
    model_name: timm/eva02_base_patch14_224.mim_in22k
    depth: 8
    model_kwargs:
      drop_rate: 0.0
      pos_drop_rate: 0.0
      patch_drop_rate: 0.0
      proj_drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.0
decoder:
  _target_: pangaea.decoders.upernet.SiamConcUPerNet
  channels: 512
  encoder: null
  num_classes: ${dataset.num_classes}
  finetune: ${finetune}
preprocessing:
  train:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.RandomCropToEncoder
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  val:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  test:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
criterion:
  _target_: pangaea.utils.losses.DICELoss
  ignore_index: ${dataset.ignore_index}
lr_scheduler:
  _target_: pangaea.utils.schedulers.MultiStepLR
  optimizer: null
  total_iters: null
  lr_milestones:
  - 0.6
  - 0.9
optimizer:
  _target_: torch.optim.AdamW
  params: null
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.05
train: true
work_dir: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/niklas/experiments/pangaea_full_seg/upernet/carl_seg
seed: 234
use_wandb: true
wandb_project: geofm-bench
wandb_run_id: dhb5bpn0
num_workers: 4
batch_size: 8
test_num_workers: 4
test_batch_size: 1
finetune: false
ckpt_dir: null
limited_label_train: 1
limited_label_val: 1
limited_label_strategy: stratified
stratification_bins: 3
data_replicate: 1
use_final_ckpt: false
