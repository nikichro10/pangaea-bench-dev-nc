task:
  trainer:
    _target_: pangaea.engine.trainer.SegTrainer
    model: null
    train_loader: null
    optimizer: null
    lr_scheduler: null
    evaluator: null
    exp_dir: null
    device: null
    criterion: null
    n_epochs: 80
    precision: fp32
    ckpt_interval: 20
    eval_interval: 5
    log_interval: 5
    best_metric_key: IoU
    use_wandb: ${use_wandb}
  evaluator:
    _target_: pangaea.engine.evaluator.SegEvaluator
    val_loader: null
    exp_dir: null
    device: null
    use_wandb: ${use_wandb}
    inference_mode: sliding
    sliding_inference_batch: 8
dataset:
  _target_: pangaea.datasets.spacenet7.SN7CD
  dataset_name: SN7CD
  root_path: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/pangaea-datasets/spacenet7cd
  download_url: https://drive.google.com/uc?id=1BADSEjxYKFZZlM-tEkRUfHvHi5XdaVV9
  auto_download: true
  img_size: 256
  domain_shift: true
  i_split: 768
  j_split: 512
  multi_temporal: 2
  multi_modal: false
  dataset_multiplier: 1
  minimum_temporal_gap: 5
  ignore_index: -1
  num_classes: 1
  classes:
  - No Change
  - Change
  distribution:
  - 0.99366
  - 0.00634
  bands:
    optical:
    - B4
    - B3
    - B2
  data_mean:
    optical:
    - 121.826
    - 106.52838
    - 78.372116
  data_std:
    optical:
    - 56.717068
    - 44.517075
    - 40.451515
  data_min:
    optical:
    - 0.0
    - 0.0
    - 0.0
  data_max:
    optical:
    - 255.0
    - 255.0
    - 255.0
encoder:
  _target_: pangaea.encoders.unet_encoder.UNet
  encoder_weights: null
  download_url: null
  input_size: ${dataset.img_size}
  topology:
  - 64
  - 128
  - 256
  - 512
  input_bands: ${dataset.bands}
  output_dim:
  - 64
  - 128
  - 256
  - 512
decoder:
  _target_: pangaea.decoders.unet.SiamConcUNet
  num_classes: ${dataset.num_classes}
  finetune: ${finetune}
preprocessing:
  train:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.RandomCropToEncoder
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  val:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
  test:
    _target_: pangaea.engine.data_preprocessor.Preprocessor
    preprocessor_cfg:
    - _target_: pangaea.engine.data_preprocessor.BandFilter
    - _target_: pangaea.engine.data_preprocessor.NormalizeMeanStd
criterion:
  _target_: pangaea.utils.losses.WeightedBCELoss
  ignore_index: ${dataset.ignore_index}
  distribution: ${dataset.distribution}
  pos_weight_power: 0.5
lr_scheduler:
  _target_: pangaea.utils.schedulers.MultiStepLR
  optimizer: null
  total_iters: null
  lr_milestones:
  - 0.6
  - 0.9
optimizer:
  _target_: torch.optim.AdamW
  params: null
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.05
train: true
work_dir: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/niklas/experiments/pangaea_full_seg/upernet/unet_seg
seed: 234
use_wandb: true
wandb_project: geofm-bench
wandb_run_id: rzal6ozf
num_workers: 4
batch_size: 8
test_num_workers: 4
test_batch_size: 1
finetune: true
ckpt_dir: null
limited_label_train: 1
limited_label_val: 1
limited_label_strategy: stratified
stratification_bins: 3
data_replicate: 2
use_final_ckpt: false
